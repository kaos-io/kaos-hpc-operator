---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcjobs
  - hpcsites
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcjobs/status
  - hpcsites/status
  verbs:
  - get
  - patch
  - update
