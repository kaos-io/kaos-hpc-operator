# This rule is not used by the project kaos-hpc-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to hpc.kaos.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kaos-hpc-operator
    app.kubernetes.io/managed-by: kustomize
  name: hpcallocation-viewer-role
rules:
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcallocations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcallocations/status
  verbs:
  - get
