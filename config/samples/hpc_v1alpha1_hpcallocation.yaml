# An organisation's node-hours on one site and account (API type only; no controller acts on it).
apiVersion: hpc.kaos.io/v1alpha1
kind: HPCAllocation
metadata:
  labels:
    app.kubernetes.io/name: kaos-hpc-operator
    app.kubernetes.io/managed-by: kustomize
  name: hpcallocation-sample
spec:
  site: meluxina
  account: p200000
  gpuNodeHours: 1000
  cpuNodeHours: 200
