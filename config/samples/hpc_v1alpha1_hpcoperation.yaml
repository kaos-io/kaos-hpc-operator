# A site operation the controller creates itself, named by a hash of its content (API type only;
# no controller acts on it yet). Spec is immutable.
apiVersion: hpc.kaos.io/v1alpha1
kind: HPCOperation
metadata:
  labels:
    app.kubernetes.io/name: kaos-hpc-operator
    app.kubernetes.io/managed-by: kustomize
  name: hpcoperation-sample
spec:
  kind: Stage
  siteName: demo-meluxina
  params: {repo: datasets-demo, commit: abc123}
