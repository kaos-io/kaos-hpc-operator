---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: hpcargoworkflowjobs.hpc.kaos.io
spec:
  group: hpc.kaos.io
  names:
    kind: HPCArgoWorkflowJob
    listKind: HPCArgoWorkflowJobList
    plural: hpcargoworkflowjobs
    singular: hpcargoworkflowjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.run.siteJobID
      name: Site job
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HPCArgoWorkflowJob is one Argo Workflow step run on an HPC site. The step creates it and supplies what the job
          needs from the platform and the run (image, command, dataset, outputs, credentials); it cannot run on its
          own. The controller admits and books it against the project's share before anything is submitted
          (PRD-HPC-1461 F-01, F-26). The name HPCJob is kept for a future kind that runs without a workflow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HPCArgoWorkflowJobSpec is one pipeline step to run on an
              HPC site (D-01).
            properties:
              class:
                description: Class is the site class the user picked, for example
                  meluxina-gpu.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              command:
                description: Command of the step.
                items:
                  type: string
                type: array
              datasetRef:
                description: DatasetRef the step reads, <dataset-repo>@<version>.
                type: string
              env:
                description: |-
                  Env is extra environment for the runner, from a fixed allowlist: OUTPUTS_REPO, OUTPUTS_REF,
                  CHECKPOINT_BUCKET, CHECKPOINT_PREFIX, KAOS_LIB_SUPPORT. Nothing else is accepted (T-02).
                items:
                  description: NameValue is one environment variable.
                  properties:
                    name:
                      maxLength: 64
                      minLength: 1
                      type: string
                    value:
                      maxLength: 2048
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: env may only set OUTPUTS_REPO, OUTPUTS_REF, CHECKPOINT_BUCKET,
                    CHECKPOINT_PREFIX, KAOS_LIB_SUPPORT
                  rule: self.all(e, e.name in ['OUTPUTS_REPO','OUTPUTS_REF','CHECKPOINT_BUCKET','CHECKPOINT_PREFIX','KAOS_LIB_SUPPORT'])
                - message: OUTPUTS_REPO and CHECKPOINT_BUCKET must be an outputs-<name>
                    repository
                  rule: self.all(e, !(e.name in ['OUTPUTS_REPO','CHECKPOINT_BUCKET'])
                    || e.value.matches('^outputs-[a-z0-9-]{1,55}$'))
              idleTimeoutMinutes:
                default: 20
                description: |-
                  IdleTimeoutMinutes is the idle watchdog's window (D-72, F-46): when the step's GPU (CPU on a
                  CPU class) utilisation stays below 5 % and its log does not grow for this many consecutive
                  minutes, the job ends the step with reason Idle. 0 disables the watchdog. Absent: 20.
                format: int32
                minimum: 0
                type: integer
              image:
                description: Image of the step.
                minLength: 1
                type: string
              nodes:
                default: 1
                description: Nodes the job asks for. Only 1 is admitted (D-41, CON-06);
                  more is refused with a reason.
                format: int32
                minimum: 1
                type: integer
              outputs:
                description: Outputs the step declares.
                items:
                  type: string
                type: array
              resumable:
                description: |-
                  Resumable makes the step continue across jobs: it gets the wall-time signal LeadMinutes before
                  its wall time, saves a checkpoint through the KAOS library and exits 85, and the job continues
                  from that checkpoint in a new site job under this same HPCArgoWorkflowJob (D-38, D-44 as amended
                  2026-11-05, F-29). Absent: the step ends when its wall time is reached.
                properties:
                  leadMinutes:
                    default: 10
                    description: |-
                      LeadMinutes before the wall time the signal arrives: the time to save and upload the
                      checkpoint (resumable="20m" gives 20).
                    format: int32
                    minimum: 1
                    type: integer
                  maxContinuations:
                    default: 5
                    description: MaxContinuations caps how many times the step continues
                      (counted apart from failure retries).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              resumableOptOut:
                description: |-
                  ResumableOptOut is resumable=False: the step is never continued from a checkpoint, even when it
                  uses the checkpoint folder and the controller has verified it (D-74). A node failure still re-runs it.
                type: boolean
              sharing:
                description: 'Sharing opts the job into node sharing under a scope
                  (PRD-1609). Absent: no sharing.'
                properties:
                  scope:
                    description: Scope jobs must have in common to share a node.
                    pattern: ^[a-z0-9]{8,16}$
                    type: string
                required:
                - scope
                type: object
              stepName:
                description: |-
                  StepName is the DAG step's name (the Argo step-name input). Setting it turns on
                  serve mode: the controller runs the job through a runner Job (PRD-HPC-1461 D-58, D-64).
                  Without it the job behaves as in phase 0 (observe and admit; the in-pod runner submits).
                maxLength: 253
                minLength: 1
                type: string
              wallTimeMinutes:
                description: WallTimeMinutes is the job's run limit once started (Slurm
                  --time).
                format: int32
                minimum: 1
                type: integer
              workflow:
                description: |-
                  Workflow is the Argo Workflow that owns the step. The controller cancels the job when the
                  Workflow is deleted, shut down or ended (D-04).
                properties:
                  name:
                    description: Name of the Workflow, in the job's namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the Workflow. A Workflow of that name with
                      another UID counts as deleted.
                    maxLength: 64
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - class
            - image
            - wallTimeMinutes
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new HPCArgoWorkflowJob
              rule: self == oldSelf
          status:
            description: |-
              HPCArgoWorkflowJobStatus: the controller owns phase, reason, message, booking and settlement; the submitter
              owns run. The two never write the same field.
            properties:
              attempt:
                description: Attempt is the current attempt (1 for the first site
                  job; +1 per continuation).
                format: int32
                type: integer
              attempts:
                description: Attempts are the finished, settled site jobs of this
                  HPCArgoWorkflowJob.
                items:
                  description: AttemptRecord is one finished site job of an HPCArgoWorkflowJob,
                    settled (written by the controller).
                  properties:
                    attempt:
                      format: int32
                      type: integer
                    endTime:
                      description: EndTime decides the budget period the spend counts
                        in.
                      format: date-time
                      type: string
                    exitCode:
                      format: int32
                      type: integer
                    nodeMinutesSaved:
                      description: |-
                        NodeMinutesSaved is set for an attempt the idle watchdog ended (reason Idle): the step's
                        limit minus the time it ran, times the nodes. A guest on a shared node reports 0 (its host's
                        booking covers the node).
                      format: int64
                      type: integer
                    outcome:
                      description: 'Outcome: Continued, Succeeded, Failed, Cancelled,
                        Timeout, ...'
                      type: string
                    settledNodeMinutes:
                      format: int64
                      type: integer
                    siteJobID:
                      type: string
                    tier:
                      description: 'Tier and SettledNodeMinutes: what the attempt
                        spent.'
                      enum:
                      - gpu
                      - cpu
                      - fpga
                      - largemem
                      type: string
                  required:
                  - attempt
                  - endTime
                  - outcome
                  - settledNodeMinutes
                  - tier
                  type: object
                type: array
              booking:
                description: Booking held by the current attempt; cleared when the
                  attempt ends.
                properties:
                  at:
                    description: At is when the booking was made.
                    format: date-time
                    type: string
                  nodeMinutes:
                    description: 'NodeMinutes booked: nodes × wall time.'
                    format: int64
                    type: integer
                  site:
                    description: Site the job was admitted to (the HPCSite's spec.site)
                      and the HPCSite that holds the ledger.
                    type: string
                  siteName:
                    type: string
                  siteNamespace:
                    description: SiteNamespace is where the HPCSite lives (the project's
                      HPC namespace).
                    type: string
                  tier:
                    description: |-
                      Tier is the kind of node-hours a class spends. Sites meter every allocation separately (MeluXina: Slurm
                      GrpTRESMins per partition, AssocGrp<TRES>Minutes when one is spent): GPU, CPU, FPGA and large memory
                      nodes each have their own budget (PRD-HPC-1461 AC-84).
                    enum:
                    - gpu
                    - cpu
                    - fpga
                    - largemem
                    type: string
                required:
                - at
                - nodeMinutes
                - site
                - siteName
                - siteNamespace
                - tier
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              continuations:
                description: Continuations so far (exit 85 with a checkpoint), counted
                  apart from failure retries.
                format: int32
                type: integer
              message:
                type: string
              outputs:
                additionalProperties:
                  type: string
                description: |-
                  Outputs are the step's declared outputs, JSON text each (at most 64 KiB in all), written by
                  the runner after stage-out and before it reports run.terminal. The follower turns them into
                  the Argo step's outputs.
                maxProperties: 64
                type: object
              pendingReason:
                description: PendingReason is the scheduler's pending reason while
                  the site job is queued (runner's poll).
                type: string
              phase:
                description: Phase of an HPCArgoWorkflowJob.
                enum:
                - Pending
                - Waiting
                - Refused
                - Admitted
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              placement:
                description: |-
                  Placement is the time limit chosen for the current attempt, set when it is admitted. Absent
                  on jobs admitted before the field existed: the spec's wallTimeMinutes applies.
                properties:
                  qos:
                    description: |-
                      QOS is the lane (site QoS) the attempt was placed in (PRD-HPC-1461 D-68, F-42). Empty: the
                      class's own QoS. It follows the QoS the runner reports using, so a lane the site refused
                      shows the class default here.
                    type: string
                  refusedQOS:
                    description: |-
                      RefusedQOS is the lane the site refused for this attempt (the runner then submitted on the
                      class default, which QOS shows). Kept so the follower and the console can say so after QOS
                      was rewritten. Empty: no refusal.
                    type: string
                  reservation:
                    description: 'Reservation is the site reservation the attempt
                      was placed in. Empty: none.'
                    type: string
                  resumable:
                    description: |-
                      Resumable is whether the step is treated as resumable, and whether that is verified (D-74). Absent for
                      a step with no earlier continuation evidence and no declaration.
                    properties:
                      reason:
                        description: 'Reason is the evidence in words: what verified
                          the step, or why it is not (for example NoProgress).'
                        maxLength: 300
                        type: string
                      since:
                        description: Since is when the latest evidence was recorded.
                        format: date-time
                        type: string
                      verified:
                        description: 'Verified: an earlier continuation of the same
                          step loaded its checkpoint and made progress.'
                        type: boolean
                    required:
                    - verified
                    type: object
                  samples:
                    description: Samples is how many earlier runs of the same step
                      the decision looked at.
                    format: int32
                    minimum: 0
                    type: integer
                  source:
                    description: Source of the limit.
                    enum:
                    - declared
                    - learned
                    - timeout-retry
                    type: string
                  timeLimitMinutes:
                    description: TimeLimitMinutes is the limit the booking and the
                      site job use.
                    format: int32
                    minimum: 1
                    type: integer
                  warning:
                    description: |-
                      Warning is a plain-words notice for the pipeline author, set at admission when a recent run
                      of the same step ended WallTimeReached at this same declared limit. It changes nothing: the
                      limit is not raised. Empty: no warning.
                    type: string
                required:
                - source
                - timeLimitMinutes
                type: object
              reason:
                type: string
              reruns:
                description: |-
                  Reruns so far: how often a step without a checkpoint was re-run from the start after a node failure
                  or pre-emption (tier 1, D-75), at most MaxReruns.
                format: int32
                type: integer
              resume:
                description: 'Resume is set for a continuation: the submitter passes
                  it to the new site job.'
                properties:
                  checkpointRef:
                    description: CheckpointRef of the attempt that saved it.
                    type: string
                  digest:
                    type: string
                  fromAttempt:
                    format: int32
                    type: integer
                  progressValues:
                    description: 'ProgressValues and Digest of the checkpoint resumed
                      from: the next attempt must get past them (D-75 3).'
                    items:
                      format: int64
                      type: integer
                    type: array
                required:
                - checkpointRef
                - fromAttempt
                type: object
              resumeEvidence:
                description: ResumeEvidence is what the latest continuation showed
                  about the step's checkpoints (D-74).
                properties:
                  at:
                    description: At is when the continuation ended.
                    format: date-time
                    type: string
                  reason:
                    description: Reason in words.
                    maxLength: 300
                    type: string
                  verified:
                    description: Verified is true when the continuation got past its
                      checkpoint, false when it did not (NoProgress).
                    type: boolean
                required:
                - at
                - verified
                type: object
              run:
                description: Run is the submitter's report of the site job.
                properties:
                  attempt:
                    description: |-
                      Attempt this report is about (status.attempt when it was written). A report of an earlier
                      attempt is ignored.
                    format: int32
                    minimum: 1
                    type: integer
                  checkpoint:
                    description: |-
                      Checkpoint is what the job reported about the checkpoint copies it keeps (D-74, D-75): the newest
                      copy's progress and size, and the step's and project's total. Reported with every attempt end.
                    properties:
                      bytes:
                        description: Bytes is the size of the newest copy.
                        format: int64
                        minimum: 0
                        type: integer
                      digest:
                        description: |-
                          Digest identifies the folder's content (sha256 over its files' checksums). A copy with another digest
                          than the one before it counts as progress when the step reports no progress values.
                        maxLength: 64
                        type: string
                      progressText:
                        description: ProgressText is the progress in words, for example
                          "epoch=3 step=1200".
                        maxLength: 200
                        type: string
                      progressValues:
                        description: |-
                          ProgressValues are the numbers the copy's progress is compared by (epoch, step, ...; most
                          significant first), when the step saved through the KAOS library. Empty: compare Digest.
                        items:
                          format: int64
                          type: integer
                        type: array
                      projectBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      skippedReason:
                        description: SkippedReason is why the latest periodic copy
                          was skipped (space guard), when it was.
                        maxLength: 300
                        type: string
                      stepBytes:
                        description: |-
                          StepBytes is all the copies the step holds (at most two) and ProjectBytes all checkpoint copies of the
                          project, as read when the report was written.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  checkpointRef:
                    description: |-
                      CheckpointRef is set with exit code 85: the lakeFS commit (or URI) of the checkpoint the job
                      staged out before it exited, checked by the submitter (T-19). Without it nothing continues.
                    type: string
                  endTime:
                    format: date-time
                    type: string
                  exitCode:
                    description: ExitCode of the job's step; 85 means it saved and
                      continues (D-44).
                    format: int32
                    type: integer
                  gpuUtilization:
                    description: |-
                      GPUUtilization is the step's GPU use as the on-node sampler last read it, per GPU (last value and
                      highest value of this site job). The runner reports it with the log offset every 30 s while the
                      job runs; the controller exports it as kaos_hpc_job_gpu_utilization_percent (PRD-1461 AC-69).
                    items:
                      description: GPUUtilization is one GPU's utilisation in percent,
                        as sampled on the compute node (nvidia-smi).
                      properties:
                        gpu:
                          description: GPU is the GPU's position in the node's nvidia-smi
                            list ("0", "1", ...).
                          maxLength: 8
                          type: string
                        maxPercent:
                          description: MaxPercent is the highest reading of this site
                            job.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        percent:
                          description: Percent is the latest reading.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - gpu
                      - maxPercent
                      - percent
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - gpu
                    x-kubernetes-list-type: map
                  hostSiteJobID:
                    description: |-
                      HostSiteJobID is set when a host job of the same project took this job onto its node
                      (node sharing, PRD-1609 D-26). The host's booking then covers the node.
                    type: string
                  lastLog:
                    description: |-
                      LastLog is the tail of the step's log (a few lines, at most 2 KiB), reported only when the
                      idle watchdog ended the step, so the controller can name what the step last said (D-72).
                    maxLength: 2048
                    type: string
                  logOffset:
                    description: |-
                      LogOffset is how far into the site job's output file the runner has printed (bytes), so a
                      restarted runner prints each line once (PRD-1461 D-65, AC-70).
                    format: int64
                    minimum: 0
                    type: integer
                  message:
                    description: |-
                      Message is a plain sentence from the submitter about why the attempt ended, set when the controller
                      cannot know it from the site (InsufficientQuota: what did not fit). At most 512 characters.
                    maxLength: 512
                    type: string
                  qos:
                    description: |-
                      QOS and Reservation are what the site job was actually submitted with. The submitter reports
                      them because it may fall back from a lane the site refused (PRD-HPC-1461 D-68).
                    type: string
                  reservation:
                    type: string
                  siteJobID:
                    description: SiteJobID is the scheduler's job id.
                    type: string
                  slot:
                    description: Slot is the GPU slot the host gave this job.
                    format: int32
                    type: integer
                  startTime:
                    description: StartTime and EndTime as the site reports them.
                    format: date-time
                    type: string
                  state:
                    description: State is the scheduler's job state, for example PENDING,
                      RUNNING, COMPLETED, FAILED, TIMEOUT.
                    type: string
                  terminal:
                    description: Terminal is set by the submitter once the job will
                      not run again (it gave up retrying).
                    type: boolean
                type: object
              runner:
                description: Runner is the runner Job of the current attempt (serve
                  mode).
                properties:
                  attempt:
                    description: Attempt the Job runs.
                    format: int32
                    type: integer
                  jobName:
                    description: JobName of the Kubernetes Job, in the HPCSite's namespace.
                    type: string
                required:
                - attempt
                - jobName
                type: object
              settledNodeMinutes:
                description: SettledNodeMinutes is the job's actual spend over all
                  its attempts, set once it ended.
                format: int64
                type: integer
              site:
                description: |-
                  Site is the HPCSite the job was first admitted to; it stays set across continuations, so every
                  attempt's spend counts on the same project ledger.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              siteMissingSince:
                description: |-
                  SiteMissingSince is when the controller first found the job's HPCSite (or its project label) gone while
                  the job holds a booking; cleared when it is back. After the grace period the job is cancelled.
                format: date-time
                type: string
              siteObservation:
                description: |-
                  SiteObservation is the controller's batched reading of the site job's state (D-36). Optional:
                  absent when the poller is off or has not read the job yet.
                properties:
                  comment:
                    description: |-
                      Comment is the site job's comment, when the site reports it (node sharing, PRD-1609: a host
                      writes kaos-state=taken|done into its guest's comment). Nil: not reported, so a sharing
                      reader reads it from the job itself.
                    type: string
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is the controller's poll interval; a reader treats an observation older than
                      three intervals as the controller being down.
                    format: int32
                    minimum: 1
                    type: integer
                  jobID:
                    description: |-
                      JobID is the site job this observation is about (a resubmit changes it; a reader ignores an
                      observation of another id).
                    type: string
                  observedAt:
                    description: ObservedAt is when the controller read the site.
                    format: date-time
                    type: string
                  pendingReason:
                    description: PendingReason is Slurm's reason while the job is
                      pending, when the site reports one.
                    type: string
                  state:
                    description: |-
                      State is the scheduler's job state(s), comma separated, for example PENDING or RUNNING. Empty:
                      the site no longer lists the job (it left slurmctld's memory), so the reader asks accounting.
                    type: string
                required:
                - jobID
                - observedAt
                type: object
              sweep:
                description: |-
                  Sweep is set while the attempt is ending but the site has not yet confirmed that its job is over
                  (the runner Job failed or was deleted, or a cancel was requested): the booking is kept until it has.
                properties:
                  launches:
                    description: Launches is how many cancel-only runner Jobs were
                      started for it.
                    format: int32
                    type: integer
                  message:
                    type: string
                  phase:
                    description: Phase, Reason and Message are what the job becomes
                      once the site has confirmed the end.
                    enum:
                    - Pending
                    - Waiting
                    - Refused
                    - Admitted
                    - Running
                    - Succeeded
                    - Failed
                    - Cancelled
                    type: string
                  reason:
                    type: string
                  since:
                    description: Since is when the sweep began; the give-up time counts
                      from it.
                    format: date-time
                    type: string
                required:
                - phase
                - reason
                - since
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
