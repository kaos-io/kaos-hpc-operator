---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: hpcargoworkflowjobs.hpc.kaos.io
spec:
  group: hpc.kaos.io
  names:
    kind: HPCArgoWorkflowJob
    listKind: HPCArgoWorkflowJobList
    plural: hpcargoworkflowjobs
    singular: hpcargoworkflowjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.run.siteJobID
      name: Site job
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HPCArgoWorkflowJob is one Argo Workflow step run on an HPC site. The step creates it and supplies what the job
          needs from the platform and the run (image, command, step context, inputs, credentials); it cannot run on its
          own. The controller admits and books it against the project's share before anything is submitted
          (PRD-HPC-1461 F-01, F-26). The name HPCJob is kept for a future kind that runs without a workflow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HPCArgoWorkflowJobSpec is one pipeline step to run on an
              HPC site (D-01).
            properties:
              app:
                description: App is the app the step belongs to, as the step context
                  names it.
                maxLength: 55
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              class:
                description: Class is the site class the user picked, for example
                  meluxina-gpu.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              command:
                description: Command of the step.
                items:
                  type: string
                type: array
              context:
                description: |-
                  Context is the step context (docs/step-contract.md, section 3) in wire form, exactly as the follower
                  received it in KAOS_STEP_CONTEXT. The step in the job gets it under the same name, unchanged. Nothing
                  rewrites it. A job without it is refused.
                maxLength: 98304
                minLength: 1
                type: string
              env:
                description: |-
                  Env is extra environment for the step, from a fixed allowlist: KAOS_LIB_SUPPORT. Nothing else is
                  accepted (T-02).
                items:
                  description: NameValue is one environment variable.
                  properties:
                    name:
                      maxLength: 64
                      minLength: 1
                      type: string
                    value:
                      maxLength: 2048
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: env may only set KAOS_LIB_SUPPORT
                  rule: self.all(e, e.name in ['KAOS_LIB_SUPPORT'])
              idleTimeoutMinutes:
                default: 20
                description: |-
                  IdleTimeoutMinutes is the idle watchdog's window (D-72, F-46): when the step's GPU (CPU on a
                  CPU class) utilisation stays below 5 % and its log does not grow for this many consecutive
                  minutes, the job ends the step with reason Idle. 0 disables the watchdog. Absent: 20.
                format: int32
                minimum: 0
                type: integer
              image:
                description: Image of the step.
                minLength: 1
                type: string
              inputs:
                description: |-
                  Inputs are the datasets staged on the site before the step starts, each pinned to one commit: every
                  read of the context's ledger and every dataset a needed step wrote. The follower fills it from the
                  context and from nothing else; the runner stages exactly these commits and never resolves a version.
                  Absent: the step reads no dataset.
                items:
                  description: StepInput is one dataset the step reads, at one commit.
                  properties:
                    commit:
                      description: Commit is the lakeFS commit that is staged and
                        read.
                      maxLength: 64
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    line:
                      description: Line is reserved for the branch form of a dataset
                        (PRD kaos#1911 D-01). Nothing reads it yet.
                      maxLength: 255
                      type: string
                    name:
                      description: |-
                        Name is the input's name: what the step asks for (input("name")). On the site the staged copy is the
                        folder of this name under the step's staged root.
                      maxLength: 40
                      pattern: ^[A-Za-z0-9]([A-Za-z0-9_-]*[A-Za-z0-9])?$
                      type: string
                    owner:
                      description: |-
                        Owner is the project that shares the dataset with this one. Absent: the project's own dataset. A job
                        with an owner is refused: a dataset of another project cannot be staged on an HPC site yet.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    ref:
                      description: 'Ref is what the run asked for (latest, a name,
                        a commit). It is a label: the commit decides what is read.'
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$
                      type: string
                    repo:
                      description: 'Repo is the dataset''s repository: a platform
                        Dataset is a repository named dataset-<name>.'
                      maxLength: 63
                      pattern: ^dataset-[a-z0-9][a-z0-9-]{0,54}$
                      type: string
                  required:
                  - commit
                  - name
                  - repo
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              nodes:
                default: 1
                description: Nodes the job asks for. Only 1 is admitted (D-41, CON-06);
                  more is refused with a reason.
                format: int32
                minimum: 1
                type: integer
              resumable:
                description: |-
                  Resumable declares that the step continues across jobs: it gets the wall-time signal LeadMinutes before
                  its wall time, saves a checkpoint (its checkpoint folder, or the KAOS library) and exits 85, and the job
                  continues from that checkpoint in a new site job under this same HPCArgoWorkflowJob (D-38, D-44 as amended
                  2026-11-05, F-29). A declared step may also ask for more wall time than the longest run the class allows: it
                  then runs as continuations. Absent: the step is not declared resumable, but one that left a checkpoint copy
                  is still continued (capped at 5) and one that did so successfully is verified resumable (D-74); a step
                  that is neither is refused with TooLongNotResumable when it asks for more than the longest run.
                properties:
                  leadMinutes:
                    default: 10
                    description: |-
                      LeadMinutes before the wall time the signal arrives: the time to save and upload the
                      checkpoint (resumable="20m" gives 20).
                    format: int32
                    minimum: 1
                    type: integer
                  maxContinuations:
                    default: 5
                    description: MaxContinuations caps how many times the step continues
                      (counted apart from failure retries).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              resumableOptOut:
                description: |-
                  ResumableOptOut is resumable=False: the step is never continued from a checkpoint, even when it
                  uses the checkpoint folder and the controller has verified it (D-74). A node failure still re-runs it.
                type: boolean
              sharing:
                description: 'Sharing opts the job into node sharing under a scope
                  (PRD-1609). Absent: no sharing.'
                properties:
                  scope:
                    description: Scope jobs must have in common to share a node.
                    pattern: ^[a-z0-9]{8,16}$
                    type: string
                required:
                - scope
                type: object
              stepName:
                description: |-
                  StepName is the DAG step's name (the Argo step-name input). Setting it turns on
                  serve mode: the controller runs the job through a runner Job (PRD-HPC-1461 D-58, D-64).
                  Without it the job behaves as in phase 0 (observe and admit; the in-pod runner submits).
                maxLength: 253
                minLength: 1
                type: string
              wallTimeMinutes:
                description: WallTimeMinutes is the job's run limit once started (Slurm
                  --time).
                format: int32
                minimum: 1
                type: integer
              workflow:
                description: |-
                  Workflow is the Argo Workflow that owns the step. The controller cancels the job when the
                  Workflow is deleted, shut down or ended (D-04).
                properties:
                  name:
                    description: Name of the Workflow, in the job's namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the Workflow. A Workflow of that name with
                      another UID counts as deleted.
                    maxLength: 64
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - app
            - class
            - context
            - image
            - wallTimeMinutes
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new HPCArgoWorkflowJob
              rule: self == oldSelf
          status:
            description: |-
              HPCArgoWorkflowJobStatus: the controller owns phase, reason, message, booking and settlement; the submitter
              owns run. The two never write the same field.
            properties:
              attempt:
                description: Attempt is the current attempt (1 for the first site
                  job; +1 per continuation).
                format: int32
                type: integer
              attempts:
                description: Attempts are the finished, settled site jobs of this
                  HPCArgoWorkflowJob.
                items:
                  description: AttemptRecord is one finished site job of an HPCArgoWorkflowJob,
                    settled (written by the controller).
                  properties:
                    attempt:
                      format: int32
                      type: integer
                    endTime:
                      description: EndTime decides the budget period the spend counts
                        in.
                      format: date-time
                      type: string
                    exitCode:
                      format: int32
                      type: integer
                    hostJobOpen:
                      description: |-
                        HostJobOpen: this attempt was a host whose Slurm job still held the node for guests when its step
                        ended (D-26). Its settlement is provisional and its booking stays held until the runner reports the
                        job's own end; the attempt is then settled from the job's start to that end.
                      type: boolean
                    nodeMinutesSaved:
                      description: |-
                        NodeMinutesSaved is set for an attempt the idle watchdog ended (reason Idle): the step's
                        limit minus the time it ran, times the nodes. A guest on a shared node reports 0 (its host's
                        booking covers the node).
                      format: int64
                      type: integer
                    outcome:
                      description: 'Outcome: Continued, Succeeded, Failed, Cancelled,
                        Timeout, ...'
                      type: string
                    queueReplaced:
                      description: |-
                        QueueReplaced and QueueReplacedCount are copied from the attempt's run when it is settled: the
                        queued site jobs replaced during the attempt (the newest QueueReplacedKept, and the total). The
                        attempt's queue place was lost that many times (AC-35).
                      items:
                        description: |-
                          QueueReplacement is one queued site job the runner replaced by a fresh one (PRD-HPC-1461 AC-35): the
                          replacement loses the job's place in the site's queue, so it is recorded.
                        properties:
                          at:
                            description: At is when the runner replaced the job.
                            format: date-time
                            type: string
                          newSiteJobID:
                            maxLength: 32
                            type: string
                          oldSiteJobID:
                            description: OldSiteJobID is the cancelled job; NewSiteJobID
                              its replacement.
                            maxLength: 32
                            type: string
                          queuedSeconds:
                            description: QueuedSeconds is how long the old job had
                              been queued.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              Reason: TokenRefresh (the job's wallet or token would expire before it started: the replacement
                              carries fresh credentials), HostLost (the host a guest waited for is gone), Replanned (the
                              controller planned a waiting guest as a host).
                            enum:
                            - TokenRefresh
                            - HostLost
                            - Replanned
                            type: string
                        required:
                        - at
                        - newSiteJobID
                        - oldSiteJobID
                        - queuedSeconds
                        - reason
                        type: object
                      maxItems: 5
                      type: array
                    queueReplacedCount:
                      format: int32
                      minimum: 0
                      type: integer
                    settledNodeMinutes:
                      format: int64
                      type: integer
                    siteJobID:
                      type: string
                    tier:
                      description: 'Tier and SettledNodeMinutes: what the attempt
                        spent.'
                      enum:
                      - gpu
                      - cpu
                      - fpga
                      - largemem
                      type: string
                  required:
                  - attempt
                  - endTime
                  - outcome
                  - settledNodeMinutes
                  - tier
                  type: object
                type: array
              booking:
                description: Booking held by the current attempt; cleared when the
                  attempt ends.
                properties:
                  at:
                    description: At is when the booking was made.
                    format: date-time
                    type: string
                  nodeMinutes:
                    description: 'NodeMinutes booked: nodes × wall time.'
                    format: int64
                    type: integer
                  site:
                    description: Site the job was admitted to (the HPCSite's spec.site)
                      and the HPCSite that holds the ledger.
                    type: string
                  siteName:
                    type: string
                  siteNamespace:
                    description: SiteNamespace is where the HPCSite lives (the project's
                      HPC namespace).
                    type: string
                  tier:
                    description: |-
                      Tier is the kind of node-hours a class spends. Sites meter every allocation separately (MeluXina: Slurm
                      GrpTRESMins per partition, AssocGrp<TRES>Minutes when one is spent): GPU, CPU, FPGA and large memory
                      nodes each have their own budget (PRD-HPC-1461 AC-84).
                    enum:
                    - gpu
                    - cpu
                    - fpga
                    - largemem
                    type: string
                required:
                - at
                - nodeMinutes
                - site
                - siteName
                - siteNamespace
                - tier
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              continuations:
                description: Continuations so far (exit 85 with a checkpoint), counted
                  apart from failure retries.
                format: int32
                type: integer
              message:
                type: string
              pendingReason:
                description: PendingReason is the scheduler's pending reason while
                  the site job is queued (runner's poll).
                type: string
              phase:
                description: Phase of an HPCArgoWorkflowJob.
                enum:
                - Pending
                - Waiting
                - Refused
                - Admitted
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              placement:
                description: |-
                  Placement is the time limit chosen for the current attempt, set when it is admitted. Absent
                  on jobs admitted before the field existed: the spec's wallTimeMinutes applies.
                properties:
                  qos:
                    description: |-
                      QOS is the lane (site QoS) the attempt was placed in (PRD-HPC-1461 D-68, F-42). Empty: the
                      class's own QoS. It follows the QoS the runner reports using, so a lane the site refused
                      shows the class default here.
                    type: string
                  refusedQOS:
                    description: |-
                      RefusedQOS is the lane the site refused for this attempt (the runner then submitted on the
                      class default, which QOS shows). Kept so the follower and the console can say so after QOS
                      was rewritten. Empty: no refusal.
                    type: string
                  reservation:
                    description: 'Reservation is the site reservation the attempt
                      was placed in. Empty: none.'
                    type: string
                  resumable:
                    description: |-
                      Resumable is whether the step is treated as resumable, and whether that is verified (D-74). Absent for
                      a step with no earlier continuation evidence and no declaration.
                    properties:
                      reason:
                        description: 'Reason is the evidence in words: what verified
                          the step, or why it is not (for example NoProgress).'
                        maxLength: 300
                        type: string
                      since:
                        description: Since is when the latest evidence was recorded.
                        format: date-time
                        type: string
                      verified:
                        description: 'Verified: an earlier continuation of the same
                          step loaded its checkpoint and made progress.'
                        type: boolean
                    required:
                    - verified
                    type: object
                  samples:
                    description: Samples is how many earlier runs of the same step
                      the decision looked at.
                    format: int32
                    minimum: 0
                    type: integer
                  share:
                    description: |-
                      Share is the attempt's place in a shared node (PRD-HPC-1461 D-26, D-70): a host that owns a node, or a
                      guest planned onto a host's node. Absent for a step that does not share (resumable, no scope, or the site
                      does not share) and on jobs admitted before the field existed (then each job is its own host).
                    properties:
                      host:
                        description: Host is the HPCArgoWorkflowJob (namespace/name)
                          a guest is planned onto. Empty for a host.
                        type: string
                      jobLimitMinutes:
                        description: |-
                          JobLimitMinutes is the time limit of a host's Slurm job: its step's limit padded for guests (twice, capped by the
                          class's and the lane's maximum). A guest must end 6 minutes before the host's job does. Zero for a guest.
                        format: int32
                        minimum: 0
                        type: integer
                      replans:
                        description: |-
                          Replans is how often a guest that was not taken was planned again (host ended, did not start in time, no
                          longer fits, or did not take it). At the bound the guest becomes a host.
                        format: int32
                        minimum: 0
                        type: integer
                      role:
                        description: Role of the attempt.
                        enum:
                        - host
                        - guest
                        type: string
                      since:
                        description: |-
                          Since is when the role was decided; a guest's wait for its host is measured from the later of it and the
                          host's own.
                        format: date-time
                        type: string
                    required:
                    - role
                    - since
                    type: object
                  source:
                    description: Source of the limit.
                    enum:
                    - declared
                    - learned
                    - timeout-retry
                    type: string
                  timeLimitMinutes:
                    description: TimeLimitMinutes is the limit the booking and the
                      site job use.
                    format: int32
                    minimum: 1
                    type: integer
                  warning:
                    description: |-
                      Warning is a plain-words notice for the pipeline author, set at admission when a recent run
                      of the same step ended WallTimeReached at this same declared limit. It changes nothing: the
                      limit is not raised. Empty: no warning.
                    type: string
                required:
                - source
                - timeLimitMinutes
                type: object
              reason:
                type: string
              reruns:
                description: |-
                  Reruns so far: how often a step without a checkpoint was re-run from the start after a node failure
                  or pre-emption (tier 1, D-75), at most MaxReruns.
                format: int32
                type: integer
              result:
                description: |-
                  Result is the step's result (docs/step-contract.md, section 4) in wire form, as the job handed it back:
                  the runner writes it with its report of a step that ended well, after it checked it. Set only on a job
                  that Succeeded, and every job the runner reports as succeeded has one: a step that ended well without a
                  result fails. The follower hands it on as the step's kaos-result.
                maxLength: 8192
                type: string
              resume:
                description: 'Resume is set for a continuation: the submitter passes
                  it to the new site job.'
                properties:
                  checkpointRef:
                    description: CheckpointRef of the attempt that saved it.
                    type: string
                  digest:
                    type: string
                  fromAttempt:
                    format: int32
                    type: integer
                  progressValues:
                    description: 'ProgressValues and Digest of the checkpoint resumed
                      from: the next attempt must get past them (D-75 3).'
                    items:
                      format: int64
                      type: integer
                    type: array
                required:
                - checkpointRef
                - fromAttempt
                type: object
              resumeEvidence:
                description: ResumeEvidence is what the latest continuation showed
                  about the step's checkpoints (D-74).
                properties:
                  at:
                    description: At is when the continuation ended.
                    format: date-time
                    type: string
                  reason:
                    description: Reason in words.
                    maxLength: 300
                    type: string
                  verified:
                    description: Verified is true when the continuation got past its
                      checkpoint, false when it did not (NoProgress).
                    type: boolean
                required:
                - at
                - verified
                type: object
              run:
                description: Run is the submitter's report of the site job.
                properties:
                  attempt:
                    description: |-
                      Attempt this report is about (status.attempt when it was written). A report of an earlier
                      attempt is ignored.
                    format: int32
                    minimum: 1
                    type: integer
                  checkpoint:
                    description: |-
                      Checkpoint is what the job reported about the checkpoint copies it keeps (D-74, D-75): the newest
                      copy's progress and size, and the step's and project's total. Reported with every attempt end.
                    properties:
                      bytes:
                        description: Bytes is the size of the newest copy.
                        format: int64
                        minimum: 0
                        type: integer
                      digest:
                        description: |-
                          Digest identifies the folder's content (sha256 over its files' checksums). A copy with another digest
                          than the one before it counts as progress when the step reports no progress values.
                        maxLength: 64
                        type: string
                      progressText:
                        description: ProgressText is the progress in words, for example
                          "epoch=3 step=1200".
                        maxLength: 200
                        type: string
                      progressValues:
                        description: |-
                          ProgressValues are the numbers the copy's progress is compared by (epoch, step, ...; most
                          significant first), when the step saved through the KAOS library. Empty: compare Digest.
                        items:
                          format: int64
                          type: integer
                        type: array
                      projectBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      skippedReason:
                        description: SkippedReason is why the latest periodic copy
                          was skipped (space guard), when it was.
                        maxLength: 300
                        type: string
                      stepBytes:
                        description: |-
                          StepBytes is all the copies the step holds (at most two) and ProjectBytes all checkpoint copies of the
                          project, as read when the report was written.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  checkpointRef:
                    description: |-
                      CheckpointRef names the newest verified checkpoint copy the job left on the site's scratch, as
                      scratch://<tar path>#<sha256> (T-19). It is reported with every recoverable end (exit 85, wall time, node
                      failure, pre-emption, idle kill). Without it a step is not continued from a checkpoint.
                    type: string
                  endTime:
                    format: date-time
                    type: string
                  exitCode:
                    description: |-
                      ExitCode of the job's step; 85 means it saved and continues (D-44). Codes the job script and the runner
                      reserve: 210 (no Apptainer), 231 (image pull), 232 (staging), 233 (batch script), 234 (no verified
                      checkpoint to restore), 235 (checkpoint copy or job comment failed), 236 (Idle), 237 (InsufficientQuota),
                      238 (SubmitLimit), 239 (InvalidImage), 240 (GPUViolation), 241 (StagingMismatch), 242 (ReservedName),
                      243 (ResultNotHandedBack), 244 (InvalidResult).
                    format: int32
                    type: integer
                  gpuUtilization:
                    description: |-
                      GPUUtilization is the step's GPU use as the on-node sampler last read it, per GPU (last value and
                      highest value of this site job). The runner reports it with the log offset every 30 s while the
                      job runs; the controller exports it as kaos_hpc_job_gpu_utilization_percent (PRD-1461 AC-69).
                    items:
                      description: GPUUtilization is one GPU's utilisation in percent,
                        as sampled on the compute node (nvidia-smi).
                      properties:
                        gpu:
                          description: GPU is the GPU's position in the node's nvidia-smi
                            list ("0", "1", ...).
                          maxLength: 8
                          type: string
                        maxPercent:
                          description: MaxPercent is the highest reading of this site
                            job.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        percent:
                          description: Percent is the latest reading.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - gpu
                      - maxPercent
                      - percent
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - gpu
                    x-kubernetes-list-type: map
                  hostJobEndTime:
                    description: |-
                      HostJobEndTime is the end of a host's Slurm job when it ended after the step (D-26): the attempt is
                      settled to it. EndTime stays the step's own end, so a learned limit comes from the step's run time,
                      never from the time the node was kept for guests (D-67).
                    format: date-time
                    type: string
                  hostJobOpen:
                    description: |-
                      HostJobOpen is set on a host's terminal report when its step ended but its Slurm job still holds the
                      node for guests (node sharing, D-26): the site charges the node until that job ends. The runner
                      reports the job's own end with HostJobOpen unset; until then the host's booking stays held.
                    type: boolean
                  hostSiteJobID:
                    description: |-
                      HostSiteJobID is set when a host job of the same project took this job onto its node
                      (node sharing, PRD-1609 D-26). The host's booking then covers the node.
                    type: string
                  lastLog:
                    description: |-
                      LastLog is the tail of the step's log (a few lines, at most 2 KiB), reported only when the
                      idle watchdog ended the step, so the controller can name what the step last said (D-72).
                    maxLength: 2048
                    type: string
                  logOffset:
                    description: |-
                      LogOffset is how far into the site job's output file the runner has printed (bytes), so a
                      restarted runner prints each line once (PRD-1461 D-65, AC-70).
                    format: int64
                    minimum: 0
                    type: integer
                  message:
                    description: |-
                      Message is a plain sentence from the submitter about why the attempt ended, set when the controller
                      cannot know it from the site (InsufficientQuota: what did not fit; SubmitLimit: the site's cap and the
                      count it read). At most 512 characters.
                    maxLength: 512
                    type: string
                  qos:
                    description: |-
                      QOS and Reservation are what the site job was actually submitted with. The submitter reports
                      them because it may fall back from a lane the site refused (PRD-HPC-1461 D-68).
                    type: string
                  queueReplaced:
                    description: |-
                      QueueReplaced lists the newest replacements of a queued site job of this attempt (at most
                      QueueReplacedKept, oldest first); QueueReplacedCount counts all of them. A queued job is replaced
                      before its credentials expire, which loses its place in the site's queue (AC-35).
                    items:
                      description: |-
                        QueueReplacement is one queued site job the runner replaced by a fresh one (PRD-HPC-1461 AC-35): the
                        replacement loses the job's place in the site's queue, so it is recorded.
                      properties:
                        at:
                          description: At is when the runner replaced the job.
                          format: date-time
                          type: string
                        newSiteJobID:
                          maxLength: 32
                          type: string
                        oldSiteJobID:
                          description: OldSiteJobID is the cancelled job; NewSiteJobID
                            its replacement.
                          maxLength: 32
                          type: string
                        queuedSeconds:
                          description: QueuedSeconds is how long the old job had been
                            queued.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            Reason: TokenRefresh (the job's wallet or token would expire before it started: the replacement
                            carries fresh credentials), HostLost (the host a guest waited for is gone), Replanned (the
                            controller planned a waiting guest as a host).
                          enum:
                          - TokenRefresh
                          - HostLost
                          - Replanned
                          type: string
                      required:
                      - at
                      - newSiteJobID
                      - oldSiteJobID
                      - queuedSeconds
                      - reason
                      type: object
                    maxItems: 5
                    type: array
                  queueReplacedCount:
                    format: int32
                    minimum: 0
                    type: integer
                  reservation:
                    type: string
                  siteJobID:
                    description: SiteJobID is the scheduler's job id.
                    type: string
                  slot:
                    description: Slot is the GPU slot the host gave this job.
                    format: int32
                    type: integer
                  staged:
                    description: |-
                      Staged says how each of the step's inputs (spec.inputs) was staged before submit, one record per dataset
                      commit (first copy, delta or already cached; what was copied and how long it took). Absent when the step
                      has no input; an input the job stages itself has no record. The follower prints one "HPC: dataset ...
                      staged" line per record.
                    items:
                      description: |-
                        StagingStatus says how one dataset of the step was staged on the site's scratch before the site job was
                        submitted. It is bounded (one short record, no paths) and set by the runner; the follower prints it
                        as one line in the step's log.
                      properties:
                        bytes:
                          description: Bytes is the number of bytes copied in this
                            staging (0 when cached).
                          format: int64
                          minimum: 0
                          type: integer
                        commit:
                          description: Commit is the pinned commit, shortened to 12
                            characters.
                          maxLength: 12
                          type: string
                        files:
                          description: Files is the number of files copied in this
                            staging (0 when cached).
                          format: int32
                          minimum: 0
                          type: integer
                        kind:
                          description: Kind is first, delta or cached.
                          enum:
                          - first
                          - delta
                          - cached
                          type: string
                        repo:
                          description: Repo is the dataset repository's name.
                          maxLength: 128
                          type: string
                        seconds:
                          description: Seconds is how long the staging took (0 when
                            cached).
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - bytes
                      - commit
                      - files
                      - kind
                      - repo
                      - seconds
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  startTime:
                    description: StartTime and EndTime as the site reports them.
                    format: date-time
                    type: string
                  state:
                    description: State is the scheduler's job state, for example PENDING,
                      RUNNING, COMPLETED, FAILED, TIMEOUT.
                    type: string
                  terminal:
                    description: Terminal is set by the submitter once the job will
                      not run again (it gave up retrying).
                    type: boolean
                type: object
              runner:
                description: Runner is the runner Job of the current attempt (serve
                  mode).
                properties:
                  attempt:
                    description: Attempt the Job runs.
                    format: int32
                    type: integer
                  jobName:
                    description: JobName of the Kubernetes Job, in the HPCSite's namespace.
                    type: string
                required:
                - attempt
                - jobName
                type: object
              settledNodeMinutes:
                description: SettledNodeMinutes is the job's actual spend over all
                  its attempts, set once it ended.
                format: int64
                type: integer
              site:
                description: |-
                  Site is the HPCSite the job was first admitted to; it stays set across continuations, so every
                  attempt's spend counts on the same project ledger.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              siteMissingSince:
                description: |-
                  SiteMissingSince is when the controller first found the job's HPCSite (or its project label) gone while
                  the job holds a booking; cleared when it is back. After the grace period the job is cancelled.
                format: date-time
                type: string
              siteObservation:
                description: |-
                  SiteObservation is the controller's batched reading of the site job's state (D-36). Optional:
                  absent when the poller is off or has not read the job yet.
                properties:
                  comment:
                    description: |-
                      Comment is the site job's comment, when the site reports it (node sharing, PRD-1609: a host
                      writes kaos-state=taken|done into its guest's comment). Nil: not reported, so a sharing
                      reader reads it from the job itself.
                    type: string
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is the controller's poll interval; a reader treats an observation older than
                      three intervals as the controller being down.
                    format: int32
                    minimum: 1
                    type: integer
                  jobID:
                    description: |-
                      JobID is the site job this observation is about (a resubmit changes it; a reader ignores an
                      observation of another id).
                    type: string
                  observedAt:
                    description: ObservedAt is when the controller read the site.
                    format: date-time
                    type: string
                  pendingReason:
                    description: PendingReason is Slurm's reason while the job is
                      pending, when the site reports one.
                    type: string
                  state:
                    description: |-
                      State is the scheduler's job state(s), comma separated, for example PENDING or RUNNING. Empty:
                      the site no longer lists the job (it left slurmctld's memory), so the reader asks accounting.
                    type: string
                required:
                - jobID
                - observedAt
                type: object
              sweep:
                description: |-
                  Sweep is set while the attempt is ending but the site has not yet confirmed that its job is over
                  (the runner Job failed or was deleted, or a cancel was requested): the booking is kept until it has.
                properties:
                  launches:
                    description: Launches is how many cancel-only runner Jobs were
                      started for it.
                    format: int32
                    type: integer
                  message:
                    type: string
                  phase:
                    description: Phase, Reason and Message are what the job becomes
                      once the site has confirmed the end.
                    enum:
                    - Pending
                    - Waiting
                    - Refused
                    - Admitted
                    - Running
                    - Succeeded
                    - Failed
                    - Cancelled
                    type: string
                  reason:
                    type: string
                  since:
                    description: Since is when the sweep began; the give-up time counts
                      from it.
                    format: date-time
                    type: string
                required:
                - phase
                - reason
                - since
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
