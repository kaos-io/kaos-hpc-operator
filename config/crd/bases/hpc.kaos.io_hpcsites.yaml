---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: hpcsites.hpc.kaos.io
spec:
  group: hpc.kaos.io
  names:
    kind: HPCSite
    listKind: HPCSiteList
    plural: hpcsites
    singular: hpcsite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.site
      name: Site
      type: string
    - jsonPath: .status.gpu.leftNodeMinutes
      name: GPU left min
      type: integer
    - jsonPath: .status.activeJobs
      name: Active
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HPCSite is one KAOS project's specification for one HPC site: the site part from the KAOS
          profile and the tenant part (identity, budget share, policy, limits, classes). Owned by the
          KubeProject and rendered by kubecore-operator (PRD-HPC-1461 D-47).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HPCSiteSpec is one KAOS project's whole specification for
              one site (D-47).
            properties:
              allowedClasses:
                description: AllowedClasses restricts the profile's classes for this
                  project; empty allows them all.
                items:
                  type: string
                type: array
              budget:
                description: Budget is the project's share of the org allocation.
                properties:
                  allocationRef:
                    description: 'AllocationRef is reserved and unused: the share
                      is the project''s own cap, with no org allocation.'
                    type: string
                  atLimit:
                    default: block
                    description: 'AtLimit: block (default) or warn (D-13).'
                    enum:
                    - block
                    - warn
                    type: string
                  cpuNodeHours:
                    description: CPUNodeHours per period.
                    format: int64
                    minimum: 0
                    type: integer
                  gpuNodeHours:
                    description: |-
                      GPUNodeHours per period (source share) or left on the account (source site). Zero means
                      the project may not spend GPU node-hours.
                    format: int64
                    minimum: 0
                    type: integer
                  observedAt:
                    description: ObservedAt is when the site reported the remaining
                      node-hours (source site).
                    format: date-time
                    type: string
                  siteLeft:
                    description: |-
                      SiteLeft is what the site reported left on the project's account (source share only): an
                      upper bound beside the share. Admission counts against the smaller of the share left this
                      month and SiteLeft less what ended since it was observed. Absent: the share alone.
                    properties:
                      cpuNodeHours:
                        description: CPUNodeHours left on the account.
                        format: int64
                        minimum: 0
                        type: integer
                      gpuNodeHours:
                        description: GPUNodeHours left on the account.
                        format: int64
                        minimum: 0
                        type: integer
                      observedAt:
                        description: |-
                          ObservedAt is when the site reported it. Without it, or from before the current period, the
                          figure is ignored: it cannot be placed against what ended since.
                        format: date-time
                        type: string
                    type: object
                  source:
                    default: share
                    description: |-
                      Source: share (default) or site. With site, GPUNodeHours and CPUNodeHours are what the
                      site reported left at ObservedAt; the site's figure already counts every job that ran, so
                      only bookings and attempts that ended after ObservedAt are taken off it.
                    enum:
                    - share
                    - site
                    type: string
                  warnAtPercent:
                    default: 80
                    description: WarnAtPercent of the share raises an alert (D-13).
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                type: object
              identity:
                description: Identity is the project identity on the site.
                properties:
                  account:
                    description: Account is the site account (subscription) the jobs
                      are charged to.
                    type: string
                  credentialKeyPrefix:
                    description: |-
                      CredentialKeyPrefix names this site's keys inside the namespace's shared credential Secrets
                      (meluxina-jwt, meluxina-staging): the Slurm token is <prefix>token, the stager key <prefix>id_ed25519
                      and the host pin <prefix>known_hosts. Empty (the default, and the only value a single-site project
                      has) means the unprefixed keys. A project with several sites gives each site after the first its own
                      prefix, so the Secrets stay the only two the controller's RBAC names (AC-15).
                    maxLength: 64
                    pattern: ^([a-z0-9][-a-z0-9]*\.)?$
                    type: string
                  sshKeySecretRef:
                    description: SSHKeySecretRef holds the private key used to mint
                      scheduler tokens (D-19).
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  user:
                    description: User is the site user name, for example u100001.
                    type: string
                required:
                - account
                - sshKeySecretRef
                - user
                type: object
              limits:
                description: Limits are the project's central job limits.
                properties:
                  checkpointBudgetPercent:
                    description: |-
                      CheckpointBudgetPercent is the share of the project's scratch space quota that step checkpoints may
                      hold (D-75). A periodic copy that would exceed it, or push the project over 80 % of its space or file
                      quota, is skipped. Absent or zero: 10.
                    format: int32
                    maximum: 50
                    minimum: 0
                    type: integer
                  maxConcurrentJobs:
                    description: 'MaxConcurrentJobs: extra jobs WAIT in KAOS, they
                      are never refused (D-49). Zero means no limit.'
                    format: int32
                    minimum: 0
                    type: integer
                  maxWallTimeMinutes:
                    description: MaxWallTimeMinutes caps any job's wall time; above
                      it the job is refused at admission.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              profile:
                description: Profile is the site part, rendered from the KAOS-curated
                  profile.
                properties:
                  classes:
                    description: Classes offered by the site.
                    items:
                      description: SiteClass is a site-specific choice in the run
                        form, for example meluxina-gpu (D-08, D-28).
                      properties:
                        gpus:
                          description: GPUs per step of this class (0 for CPU classes).
                          format: int32
                          minimum: 0
                          type: integer
                        lanes:
                          description: Lanes are the names of the profile's QoS this
                            class may use (D-66). Empty means only QOS.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        maxWallTimeMinutes:
                          description: MaxWallTimeMinutes is the site's limit for
                            the class's partition and QOS.
                          format: int32
                          minimum: 1
                          type: integer
                        name:
                          description: Name is unique within the site, for example
                            meluxina-gpu.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        partition:
                          description: Partition and QOS the class submits to.
                          type: string
                        qos:
                          type: string
                        tier:
                          description: Tier is whose node-hours the class spends.
                          enum:
                          - gpu
                          - cpu
                          type: string
                      required:
                      - maxWallTimeMinutes
                      - name
                      - partition
                      - tier
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  endpoint:
                    description: Endpoint of the scheduler API, for example https://slurm-api.example.org.
                    pattern: ^https://
                    type: string
                  homeRoot:
                    description: |-
                      HomeRoot is the directory holding the users' home directories on the site, for example
                      /home/users. The runner's HOME is HomeRoot/<identity.user>. Empty means /home/users.
                    type: string
                  loginHosts:
                    description: LoginHosts the controller may SSH to for token minting
                      (host:port).
                    items:
                      type: string
                    type: array
                  qos:
                    description: QOS are the lanes the project's account may use,
                      with their limits (D-66). Discovered, optional.
                    items:
                      description: SiteQOS is one QoS (lane) the project's account
                        may use on the site, as the site reports it (D-66).
                      properties:
                        maxJobsPerUser:
                          description: MaxJobsPerUser is the QoS's running-jobs-per-user
                            limit. Zero means the site reports none.
                          format: int32
                          minimum: 0
                          type: integer
                        maxWallTimeMinutes:
                          description: MaxWallTimeMinutes is the QoS's wall-time limit.
                            Zero means the site reports none.
                          format: int32
                          minimum: 0
                          type: integer
                        name:
                          description: Name of the QoS at the site, for example dev.
                          minLength: 1
                          type: string
                        preempts:
                          description: Preempts names the QoS this one preempts.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        priority:
                          description: Priority is the QoS priority.
                          format: int64
                          minimum: 0
                          type: integer
                        usageFactorMilli:
                          description: UsageFactorMilli is the usage factor times
                            1000 (1.0 is 1000), an integer so the CRD carries no float.
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  reservations:
                    description: Reservations the project's account may use (D-66).
                      Discovered, optional.
                    items:
                      description: SiteReservation is a reservation the project's
                        account may use on the site (D-66).
                      properties:
                        endTime:
                          description: EndTime is when the reservation ends.
                          format: date-time
                          type: string
                        name:
                          description: Name of the reservation at the site, for example
                            gpudev.
                          minLength: 1
                          type: string
                        nodeCount:
                          description: NodeCount is the number of reserved nodes.
                          format: int32
                          minimum: 0
                          type: integer
                        partition:
                          description: Partition the reservation covers.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  restVersion:
                    description: RESTVersion of the scheduler API, for example v0.0.44.
                    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                    type: string
                  scratchRoot:
                    description: ScratchRoot is the per-project working area on the
                      site's shared filesystem.
                    type: string
                  transport:
                    default: slurmrestd
                    description: Transport to the scheduler.
                    enum:
                    - slurmrestd
                    - ssh-slurm-cli
                    - firecrest
                    type: string
                required:
                - classes
                - endpoint
                - restVersion
                - transport
                type: object
              sharing:
                description: Sharing lets the project's one-GPU jobs share nodes (PRD-1609,
                  D-26, D-50).
                type: boolean
              site:
                description: Site is the site profile name, for example meluxina.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - budget
            - identity
            - profile
            - site
            type: object
            x-kubernetes-validations:
            - message: site is immutable
              rule: self.site == oldSelf.site
          status:
            description: HPCSiteStatus is the controller's view of the project's site
              use.
            properties:
              activeJobs:
                description: ActiveJobs is the number of admitted jobs that have not
                  ended (= queuedJobs + runningJobs).
                format: int32
                type: integer
              checkpoints:
                description: 'Checkpoints is the scratch the project''s step checkpoints
                  hold (D-75): at most two copies per step.'
                properties:
                  bytes:
                    description: Bytes held by the checkpoint copies of steps that
                      have not succeeded (a succeeded step's are deleted).
                    format: int64
                    type: integer
                  steps:
                    description: Steps is how many steps hold copies.
                    format: int32
                    type: integer
                required:
                - bytes
                - steps
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              countedFrom:
                description: |-
                  CountedFrom is where the used figures start. It equals periodStart, except for a budget of
                  source site: the share is then what the site reported left at spec.budget.observedAt, which
                  already counts everything that ended before it, so only later attempts are added.
                format: date-time
                type: string
              cpu:
                description: |-
                  TierLedger is the project's spend in one tier for the current period, in node-minutes (the
                  site meters node-minutes; shares are set in node-hours).
                properties:
                  bookedNodeMinutes:
                    description: BookedNodeMinutes held by admitted jobs that have
                      not ended (worst case, D-12).
                    format: int64
                    type: integer
                  leftNodeMinutes:
                    description: LeftNodeMinutes = share - used - booked, never below
                      zero.
                    format: int64
                    type: integer
                  usedNodeMinutes:
                    description: UsedNodeMinutes settled from finished jobs this period.
                    format: int64
                    type: integer
                required:
                - bookedNodeMinutes
                - leftNodeMinutes
                - usedNodeMinutes
                type: object
              gpu:
                description: GPU and CPU ledgers.
                properties:
                  bookedNodeMinutes:
                    description: BookedNodeMinutes held by admitted jobs that have
                      not ended (worst case, D-12).
                    format: int64
                    type: integer
                  leftNodeMinutes:
                    description: LeftNodeMinutes = share - used - booked, never below
                      zero.
                    format: int64
                    type: integer
                  usedNodeMinutes:
                    description: UsedNodeMinutes settled from finished jobs this period.
                    format: int64
                    type: integer
                required:
                - bookedNodeMinutes
                - leftNodeMinutes
                - usedNodeMinutes
                type: object
              periodStart:
                description: |-
                  PeriodStart is the start of the current budget period: always the first of the calendar
                  month, UTC.
                format: date-time
                type: string
              queuedJobs:
                description: |-
                  QueuedJobs is the number of active jobs the site has not started yet: admitted, submitted
                  or pending in the site's queue.
                format: int32
                type: integer
              recentJobs:
                description: |-
                  RecentJobs are at most RecentJobsMax of the project's jobs on this site: active jobs first,
                  then ended ones, newest first within each group. Written with the ledger, for the console.
                items:
                  description: |-
                    RecentJob is the console's view of one HPCArgoWorkflowJob of the project (PRD-HPC-1461 F-43,
                    AC-76, AC-26, AC-46). Copied from the job's status when the ledger is published: no site call.
                  properties:
                    attempt:
                      description: Attempt is the current attempt (1 for the first
                        site job).
                      format: int32
                      type: integer
                    bookedNodeMinutes:
                      description: |-
                        BookedNodeMinutes is what the current attempt holds, or for an ended job the limit times
                        nodes of its last attempt. SettledNodeMinutes is the spend of the finished attempts.
                      format: int64
                      type: integer
                    createdAt:
                      description: CreatedAt, StartTime and EndTime; start and end
                        are as the site reports them.
                      format: date-time
                      type: string
                    endTime:
                      format: date-time
                      type: string
                    hostSiteJobID:
                      maxLength: 63
                      type: string
                    idleTimeoutMinutes:
                      description: IdleTimeoutMinutes is the idle watchdog's window
                        (0 means off).
                      format: int32
                      type: integer
                    limitSamples:
                      format: int32
                      type: integer
                    limitSource:
                      description: PlacementSource says where a Placement's time limit
                        came from.
                      enum:
                      - declared
                      - learned
                      - timeout-retry
                      type: string
                    name:
                      description: Name and Namespace of the HPCArgoWorkflowJob (the
                        namespace is the environment's).
                      type: string
                    namespace:
                      type: string
                    pendingReason:
                      description: PendingReason is the scheduler's reason while the
                        site job is queued (for example Priority).
                      maxLength: 63
                      type: string
                    phase:
                      description: Phase and Reason of the job, for example Waiting
                        / WaitingForBudget or Failed / Idle.
                      enum:
                      - Pending
                      - Waiting
                      - Refused
                      - Admitted
                      - Running
                      - Succeeded
                      - Failed
                      - Cancelled
                      type: string
                    qos:
                      description: |-
                        QOS and Reservation are the lane the current attempt was placed in; RefusedQOS is the lane
                        the site refused (the job then ran on the class default).
                      maxLength: 63
                      type: string
                    reason:
                      maxLength: 63
                      type: string
                    refusedQOS:
                      maxLength: 63
                      type: string
                    reservation:
                      maxLength: 63
                      type: string
                    settledNodeMinutes:
                      format: int64
                      type: integer
                    siteJobID:
                      description: |-
                        SiteJobID is the scheduler's job id; HostSiteJobID is set when the job runs as a guest on a
                        host job's node (node sharing).
                      maxLength: 63
                      type: string
                    siteState:
                      description: SiteState is the scheduler's state of the current
                        site job (PENDING, RUNNING, ...).
                      maxLength: 63
                      type: string
                    startTime:
                      format: date-time
                      type: string
                    step:
                      description: Step is the DAG step's name and Workflow the Argo
                        Workflow it belongs to.
                      maxLength: 253
                      type: string
                    timeLimitMinutes:
                      description: |-
                        TimeLimitMinutes is the current attempt's limit; LimitSource says where it came from and
                        LimitSamples how many earlier runs of the step it learned from.
                      format: int32
                      type: integer
                    workflow:
                      maxLength: 253
                      type: string
                  required:
                  - createdAt
                  - name
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              runningJobs:
                description: |-
                  RunningJobs is the number of active jobs the site reports RUNNING, plus guests running on a
                  running host's node.
                format: int32
                type: integer
              storage:
                description: |-
                  Storage is the project's scratch quota on the site and what uses it. It is NOT written by
                  this controller: the project's snapshot job (it holds the staging key) patches this one
                  field every 10 minutes from the site stager's `usage` report. The controller's status patches
                  are merge patches of its own fields, so they leave it alone.
                properties:
                  byCategory:
                    description: |-
                      ByCategory splits the used space and files: datasets, images, checkpoints, work, and
                      other (the rest of the quota: other users and projects of the subscription).
                    items:
                      description: StorageCategory is one use of the project's scratch
                        storage.
                      properties:
                        files:
                          format: int64
                          type: integer
                        name:
                          description: Name is datasets, images, checkpoints, work
                            or other.
                          type: string
                        partial:
                          description: |-
                            Partial is true when the measurement hit its time bound: the figure is a lower bound (for
                            other, an upper bound).
                          type: boolean
                        space:
                          description: Space is bytes and Files the file (and folder)
                            count, as the site's quota counts them.
                          format: int64
                          type: integer
                      required:
                      - name
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  filesLimit:
                    format: int64
                    type: integer
                  filesUsed:
                    description: 'FilesUsed and FilesLimit are the quota''s used and
                      limit file counts (0 limit: none set).'
                    format: int64
                    type: integer
                  measuredAt:
                    format: date-time
                    type: string
                  observedAt:
                    description: |-
                      ObservedAt is when the quota was read; MeasuredAt is when the category sizes were last
                      measured (re-measured at most hourly, the quota on every report).
                    format: date-time
                    type: string
                  spaceLimit:
                    format: int64
                    type: integer
                  spaceUsed:
                    description: SpaceUsed and SpaceLimit are the quota's used and
                      limit bytes; a limit of 0 means none set.
                    format: int64
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
