apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  annotations:
    ui.kubecore.io/raw-form: '{"leafOptions":{},"optionDefaults":{"image_processing":{"conservative":{"image_processing-erasing":"0.1","image_processing-hsv_h":"0.005","image_processing-hsv_s":"0.3","image_processing-hsv_v":"0.2","image_processing-mosaic":"0.5","image_processing-scale":"0.2","image_processing-translate":"0.05"},"mosaic_default":{},"none":{"image_processing-erasing":"0.0","image_processing-hsv_h":"0.0","image_processing-hsv_s":"0.0","image_processing-hsv_v":"0.0","image_processing-mosaic":"0.0","image_processing-scale":"0.0","image_processing-translate":"0.0"}},"model":{"yolov11x":{"model-variant":"yolov11x-pose.pt"},"yolov8n":{},"yolov8s":{"model-variant":"yolov8s-pose.pt"}},"train-callbacks":{"early_stopping":{},"none":{"train-callbacks-early_stopping_enabled":"false","train-callbacks-patience":"0"}},"train-optimizer":{"adam":{"train-optimizer-lr":"0.001","train-optimizer-momentum":"0.9","train-optimizer-name":"Adam","train-optimizer-weight_decay":"0.0"},"adamw":{"train-optimizer-lr":"0.001","train-optimizer-momentum":"0.9","train-optimizer-name":"AdamW","train-optimizer-weight_decay":"0.01"},"sgd":{}},"train-qat":{"default_qat":{},"no_qat":{"train-qat-epochs":"0","train-qat-lr":"0.0"}}},"types":{"data-ref":"string","data-sample_size":"string","data-seed":"integer","dataset":"string","experiment-description":"string","experiment-name":"string","image_processing-bgr":"number","image_processing-copy_paste":"number","image_processing-degrees":"number","image_processing-erasing":"number","image_processing-fliplr":"number","image_processing-flipud":"number","image_processing-hsv_h":"number","image_processing-hsv_s":"number","image_processing-hsv_v":"number","image_processing-mixup":"number","image_processing-mosaic":"number","image_processing-perspective":"number","image_processing-scale":"number","image_processing-shear":"number","image_processing-translate":"number","logging-level":"string","logging-log_artifacts":"boolean","model-pretrained_weights":"string","model-variant":"string","quantization-calibration_frames":"integer","quantization-calibration_seed":"integer","quantization-image_size":"integer","quantization-mode":"enum","quantization-output_prefix":"string","quantization-parity_frames":"integer","quantization-parity_max_abs_error":"number","registration-promote_to":"string","registration-registered_model_name":"string","train-amp":"boolean","train-batch_size":"integer","train-callbacks-early_stopping_enabled":"boolean","train-callbacks-patience":"integer","train-checkpointing-interval_epochs":"integer","train-close_mosaic":"integer","train-cos_lr":"boolean","train-deterministic":"boolean","train-dropout":"number","train-epochs":"integer","train-export-enabled":"boolean","train-export-formats":"string","train-export-precisions":"string","train-freeze":"string","train-image_size":"integer","train-label_smoothing":"number","train-loss-box":"number","train-loss-cls":"number","train-loss-dfl":"number","train-loss-kobj":"number","train-loss-pose":"number","train-lrf":"number","train-nbs":"integer","train-optimizer-lr":"number","train-optimizer-momentum":"number","train-optimizer-name":"string","train-optimizer-weight_decay":"number","train-qat-epochs":"integer","train-qat-lr":"number","train-seed":"integer","train-warmup_epochs":"number","train-warmup_momentum":"number"},"version":1}'
  name: ml-pipeline
spec:
  arguments:
    parameters:
    - description: 'One of: conservative, mosaic_default, none.'
      enum:
      - conservative
      - mosaic_default
      - none
      name: image_processing
      value: mosaic_default
    - description: 'One of: yolov11x, yolov8n, yolov8s.'
      enum:
      - yolov11x
      - yolov8n
      - yolov8s
      name: model
      value: yolov8n
    - description: 'One of: early_stopping, none.'
      enum:
      - early_stopping
      - none
      name: train-callbacks
      value: early_stopping
    - description: 'One of: adam, adamw, sgd.'
      enum:
      - adam
      - adamw
      - sgd
      name: train-optimizer
      value: sgd
    - description: 'One of: default_qat, no_qat.'
      enum:
      - default_qat
      - no_qat
      name: train-qat
      value: default_qat
    - description: ''
      name: data-ref
      value: main
    - description: 'a whole number: train on this many images (and their labels) per
        split, to try a run quickly; empty = every image'
      name: data-sample_size
      value: ''
    - description: 'picks which images sample_size keeps: the same seed keeps the
        same ones'
      name: data-seed
      value: '42'
    - description: '''none'' skips qat-finetune AND model-quantization; ''ptq'' or
        ''qat'''
      enum:
      - none
      - ptq
      - qat
      name: quantization-mode
      value: none
    - description: must match train.image_size
      name: quantization-image_size
      value: '320'
    - description: ''
      name: quantization-calibration_frames
      value: '512'
    - description: ''
      name: quantization-calibration_seed
      value: '42'
    - description: frames for the INT8 vs FP32 parity check
      name: quantization-parity_frames
      value: '100'
    - description: run fails above this threshold
      name: quantization-parity_max_abs_error
      value: '0.05'
    - description: ''
      name: quantization-output_prefix
      value: ''
    - description: 'the end of the experiment name: the experiment is <your app>.<this>,
        empty = just <your app>; also the name of the folder your results are saved
        in. Letters, digits, - and _ only'
      name: experiment-name
      value: baseline
    - description: optional free text stored in the MLflow run
      name: experiment-description
      value: ''
    - description: 'The dataset this run trains on: <dataset-repo>@<version>. Choose
        the version on the run form. The default is your project''s own default dataset,
        which holds no images at first: a run on it trains on a small sample that
        the first step makes (docs/datasets.md). Choose a dataset of your own to train
        on your images. A dataset is its own repository (dataset-<name>); the version
        is `latest`, or a tag (v1, v2, ...) that you released on a dataset you uploaded.
        A dataset a run produced has no tag of that kind. The run pins the exact version
        when it starts, so every step reads the same data.'
      name: dataset
      value: dataset-default@latest
    - description: smallest/fastest pose variant
      name: model-variant
      value: yolov8n-pose.pt
    - description: <repository>@<version>/<path> of your own weights (init only);
        empty = the variant's standard weights
      name: model-pretrained_weights
      value: ''
    - description: 'total training epochs: enough for a first run on the small sample;
        use 100 or more on your own data'
      name: train-epochs
      value: '10'
    - description: images per step; a positive number (the training step rejects -1)
      name: train-batch_size
      value: '16'
    - description: input resolution in pixels (multiple of 32); the small sample is
        160 pixels wide, use 640 on your own data
      name: train-image_size
      value: '320'
    - description: cosine learning rate schedule (genuine boolean leaf)
      name: train-cos_lr
      value: 'true'
    - description: 'final LR ratio: final_lr = lr * lrf'
      name: train-lrf
      value: '0.01'
    - description: ''
      name: train-warmup_epochs
      value: '3.0'
    - description: ''
      name: train-warmup_momentum
      value: '0.8'
    - description: "\u2500\u2500 regularization \u2500\u2500"
      name: train-dropout
      value: '0.0'
    - description: ''
      name: train-label_smoothing
      value: '0.0'
    - description: nominal batch size for gradient scaling
      name: train-nbs
      value: '64'
    - description: freeze first N backbone layers; empty = train all
      name: train-freeze
      value: ''
    - description: automatic mixed precision (boolean)
      name: train-amp
      value: 'true'
    - description: disable mosaic for last N epochs
      name: train-close_mosaic
      value: '3'
    - description: global training RNG seed (separate from data.seed)
      name: train-seed
      value: '0'
    - description: cuDNN deterministic mode (boolean)
      name: train-deterministic
      value: 'true'
    - description: ''
      name: train-loss-pose
      value: '12.0'
    - description: ''
      name: train-loss-kobj
      value: '2.0'
    - description: ''
      name: train-loss-box
      value: '7.5'
    - description: ''
      name: train-loss-cls
      value: '0.5'
    - description: ''
      name: train-loss-dfl
      value: '1.5'
    - description: log an intermediate checkpoint to MLflow every N epochs
      name: train-checkpointing-interval_epochs
      value: '10'
    - description: boolean
      name: train-export-enabled
      value: 'false'
    - description: 'comma-separated: engine and/or onnx'
      name: train-export-formats
      value: engine
    - description: 'comma-separated: fp16 and/or int8'
      name: train-export-precisions
      value: fp16
    - description: ''
      name: train-optimizer-name
      value: SGD
    - description: initial learning rate (the trainer's lr0)
      name: train-optimizer-lr
      value: '0.01'
    - description: Adam beta1
      name: train-optimizer-momentum
      value: '0.937'
    - description: ''
      name: train-optimizer-weight_decay
      value: '0.0005'
    - description: "boolean \u2014 kill runs that stop improving"
      name: train-callbacks-early_stopping_enabled
      value: 'true'
    - description: epochs without improvement before stopping
      name: train-callbacks-patience
      value: '50'
    - description: QAT fine-tune epochs (used when quantization.mode = qat)
      name: train-qat-epochs
      value: '10'
    - description: QAT fine-tune learning rate
      name: train-qat-lr
      value: '0.0001'
    - description: Standard YOLO pose augmentation recipe (kubeline defaults).
      name: image_processing-hsv_h
      value: '0.015'
    - description: ''
      name: image_processing-hsv_s
      value: '0.7'
    - description: ''
      name: image_processing-hsv_v
      value: '0.4'
    - description: "keep 0.0 for pose \u2014 keypoints are rotation-sensitive"
      name: image_processing-degrees
      value: '0.0'
    - description: ''
      name: image_processing-translate
      value: '0.1'
    - description: ''
      name: image_processing-scale
      value: '0.5'
    - description: ''
      name: image_processing-shear
      value: '0.0'
    - description: values > 0.001 cause severe keypoint displacement
      name: image_processing-perspective
      value: '0.0'
    - description: ''
      name: image_processing-flipud
      value: '0.0'
    - description: ''
      name: image_processing-fliplr
      value: '0.0'
    - description: ''
      name: image_processing-mosaic
      value: '1.0'
    - description: ''
      name: image_processing-mixup
      value: '0.0'
    - description: ''
      name: image_processing-copy_paste
      value: '0.0'
    - description: ''
      name: image_processing-erasing
      value: '0.4'
    - description: ''
      name: image_processing-bgr
      value: '0.0'
    - description: 'the end of the registered model name: the model is <your app>.<this>,
        empty = just <your app>. Letters, digits, - and _ only'
      name: registration-registered_model_name
      value: pose
    - description: empty = no promotion; 'champion' or 'challenger' (a model registry
        alias on the best.pt version; it is not the dataset `latest` that the run-form
        choice `promote-<dataset>` moves)
      name: registration-promote_to
      value: ''
    - description: ''
      name: logging-level
      value: INFO
    - description: "boolean \u2014 upload plots/curves to MLflow"
      name: logging-log_artifacts
      value: 'true'
    - description: Extra settings for this run, as YAML. They replace the values above.
      name: config
      value: ''
  entrypoint: main
  templates:
  - container:
      args:
      - image_processing={{workflow.parameters.image_processing}}
      - model={{workflow.parameters.model}}
      - train/callbacks={{workflow.parameters.train-callbacks}}
      - train/optimizer={{workflow.parameters.train-optimizer}}
      - train/qat={{workflow.parameters.train-qat}}
      - data.ref={{workflow.parameters.data-ref}}
      - data.sample_size={{workflow.parameters.data-sample_size}}
      - data.seed={{workflow.parameters.data-seed}}
      - quantization.mode={{workflow.parameters.quantization-mode}}
      - quantization.image_size={{workflow.parameters.quantization-image_size}}
      - quantization.calibration_frames={{workflow.parameters.quantization-calibration_frames}}
      - quantization.calibration_seed={{workflow.parameters.quantization-calibration_seed}}
      - quantization.parity_frames={{workflow.parameters.quantization-parity_frames}}
      - quantization.parity_max_abs_error={{workflow.parameters.quantization-parity_max_abs_error}}
      - quantization.output_prefix={{workflow.parameters.quantization-output_prefix}}
      - experiment.name={{workflow.parameters.experiment-name}}
      - experiment.description={{workflow.parameters.experiment-description}}
      - dataset={{workflow.parameters.dataset}}
      - model.variant={{workflow.parameters.model-variant}}
      - model.pretrained_weights={{workflow.parameters.model-pretrained_weights}}
      - train.epochs={{workflow.parameters.train-epochs}}
      - train.batch_size={{workflow.parameters.train-batch_size}}
      - train.image_size={{workflow.parameters.train-image_size}}
      - train.cos_lr={{workflow.parameters.train-cos_lr}}
      - train.lrf={{workflow.parameters.train-lrf}}
      - train.warmup_epochs={{workflow.parameters.train-warmup_epochs}}
      - train.warmup_momentum={{workflow.parameters.train-warmup_momentum}}
      - train.dropout={{workflow.parameters.train-dropout}}
      - train.label_smoothing={{workflow.parameters.train-label_smoothing}}
      - train.nbs={{workflow.parameters.train-nbs}}
      - train.freeze={{workflow.parameters.train-freeze}}
      - train.amp={{workflow.parameters.train-amp}}
      - train.close_mosaic={{workflow.parameters.train-close_mosaic}}
      - train.seed={{workflow.parameters.train-seed}}
      - train.deterministic={{workflow.parameters.train-deterministic}}
      - train.loss.pose={{workflow.parameters.train-loss-pose}}
      - train.loss.kobj={{workflow.parameters.train-loss-kobj}}
      - train.loss.box={{workflow.parameters.train-loss-box}}
      - train.loss.cls={{workflow.parameters.train-loss-cls}}
      - train.loss.dfl={{workflow.parameters.train-loss-dfl}}
      - train.checkpointing.interval_epochs={{workflow.parameters.train-checkpointing-interval_epochs}}
      - train.export.enabled={{workflow.parameters.train-export-enabled}}
      - train.export.formats={{workflow.parameters.train-export-formats}}
      - train.export.precisions={{workflow.parameters.train-export-precisions}}
      - train.optimizer.name={{workflow.parameters.train-optimizer-name}}
      - train.optimizer.lr={{workflow.parameters.train-optimizer-lr}}
      - train.optimizer.momentum={{workflow.parameters.train-optimizer-momentum}}
      - train.optimizer.weight_decay={{workflow.parameters.train-optimizer-weight_decay}}
      - train.callbacks.early_stopping_enabled={{workflow.parameters.train-callbacks-early_stopping_enabled}}
      - train.callbacks.patience={{workflow.parameters.train-callbacks-patience}}
      - train.qat.epochs={{workflow.parameters.train-qat-epochs}}
      - train.qat.lr={{workflow.parameters.train-qat-lr}}
      - image_processing.hsv_h={{workflow.parameters.image_processing-hsv_h}}
      - image_processing.hsv_s={{workflow.parameters.image_processing-hsv_s}}
      - image_processing.hsv_v={{workflow.parameters.image_processing-hsv_v}}
      - image_processing.degrees={{workflow.parameters.image_processing-degrees}}
      - image_processing.translate={{workflow.parameters.image_processing-translate}}
      - image_processing.scale={{workflow.parameters.image_processing-scale}}
      - image_processing.shear={{workflow.parameters.image_processing-shear}}
      - image_processing.perspective={{workflow.parameters.image_processing-perspective}}
      - image_processing.flipud={{workflow.parameters.image_processing-flipud}}
      - image_processing.fliplr={{workflow.parameters.image_processing-fliplr}}
      - image_processing.mosaic={{workflow.parameters.image_processing-mosaic}}
      - image_processing.mixup={{workflow.parameters.image_processing-mixup}}
      - image_processing.copy_paste={{workflow.parameters.image_processing-copy_paste}}
      - image_processing.erasing={{workflow.parameters.image_processing-erasing}}
      - image_processing.bgr={{workflow.parameters.image_processing-bgr}}
      - registration.registered_model_name={{workflow.parameters.registration-registered_model_name}}
      - registration.promote_to={{workflow.parameters.registration-promote_to}}
      - logging.level={{workflow.parameters.logging-level}}
      - logging.log_artifacts={{workflow.parameters.logging-log_artifacts}}
      - --render-defaults
      - '{"image_processing":"mosaic_default","model":"yolov8n","train/callbacks":"early_stopping","train/optimizer":"sgd","train/qat":"default_qat","data.ref":"main","data.sample_size":"","data.seed":"42","quantization.mode":"none","quantization.image_size":"320","quantization.calibration_frames":"512","quantization.calibration_seed":"42","quantization.parity_frames":"100","quantization.parity_max_abs_error":"0.05","quantization.output_prefix":"","experiment.name":"baseline","experiment.description":"","dataset":"dataset-default@latest","model.variant":"yolov8n-pose.pt","model.pretrained_weights":"","train.epochs":"10","train.batch_size":"16","train.image_size":"320","train.cos_lr":"true","train.lrf":"0.01","train.warmup_epochs":"3.0","train.warmup_momentum":"0.8","train.dropout":"0.0","train.label_smoothing":"0.0","train.nbs":"64","train.freeze":"","train.amp":"true","train.close_mosaic":"3","train.seed":"0","train.deterministic":"true","train.loss.pose":"12.0","train.loss.kobj":"2.0","train.loss.box":"7.5","train.loss.cls":"0.5","train.loss.dfl":"1.5","train.checkpointing.interval_epochs":"10","train.export.enabled":"false","train.export.formats":"engine","train.export.precisions":"fp16","train.optimizer.name":"SGD","train.optimizer.lr":"0.01","train.optimizer.momentum":"0.937","train.optimizer.weight_decay":"0.0005","train.callbacks.early_stopping_enabled":"true","train.callbacks.patience":"50","train.qat.epochs":"10","train.qat.lr":"0.0001","image_processing.hsv_h":"0.015","image_processing.hsv_s":"0.7","image_processing.hsv_v":"0.4","image_processing.degrees":"0.0","image_processing.translate":"0.1","image_processing.scale":"0.5","image_processing.shear":"0.0","image_processing.perspective":"0.0","image_processing.flipud":"0.0","image_processing.fliplr":"0.0","image_processing.mosaic":"1.0","image_processing.mixup":"0.0","image_processing.copy_paste":"0.0","image_processing.erasing":"0.4","image_processing.bgr":"0.0","registration.registered_model_name":"pose","registration.promote_to":"","logging.level":"INFO","logging.log_artifacts":"true"}'
      - --advanced
      - '{{workflow.parameters.config}}'
      - --require=data
      - --require=experiment
      - --require=image_processing
      - --require=logging
      - --require=model
      - --require=quantization
      - --require=registration
      - --require=train
      - --run
      - '{{workflow.name}}'
      - --run-uid
      - '{{workflow.uid}}'
      - --steps
      - '[{"name":"config-validation","kind":"control","reads":["experiment","model","quantization","registration"],"inputs":[],"needs":[],"produces":[]},{"name":"prepare-data","kind":"transform","reads":["data"],"inputs":["dataset"],"needs":["config-validation"],"produces":[{"name":"prepared","type":"dataset"}]},{"name":"model-training","kind":"train","reads":["experiment","model","train","image_processing","logging"],"inputs":[],"needs":["prepare-data"],"produces":[{"name":"checkpoints","type":"model"}]},{"name":"qat-finetune","kind":"train","reads":["train","quantization"],"inputs":[],"needs":["prepare-data","model-training"],"produces":[{"name":"qat","type":"model"}],"when_text":"quantization-mode
        == qat","when_fields":["quantization-mode"]},{"name":"model-quantization","kind":"transform","reads":["quantization"],"inputs":[],"needs":["prepare-data","model-training","qat-finetune"],"produces":[{"name":"quantization","type":"model"}],"when_text":"quantization-mode
        != none","when_fields":["quantization-mode"]},{"name":"model-registration","kind":"publish","reads":["data","registration"],"inputs":[],"needs":["prepare-data","model-training","model-quantization"],"produces":[]}]'
      - --context-dir
      - /work/context
      - --ledger-output
      - /work/kaos-ledger.json
      - --reused-dir
      - /work/reused
      - --when-field
      - quantization-mode={{=workflow.parameters['quantization-mode']}}
      command:
      - python
      - -I
      - -m
      - kaos_engine.compose
      image: platform-managed
    metadata:
      labels:
        platform.kubecore.io/step: compose-and-validate
        platform.kubecore.io/step-kind: control
    name: compose-and-validate
    outputs:
      parameters:
      - name: kaos-ledger
        valueFrom:
          path: /work/kaos-ledger.json
      - name: kaos-context-config-validation
        valueFrom:
          path: /work/context/config-validation.json
      - name: kaos-context-prepare-data
        valueFrom:
          path: /work/context/prepare-data.json
      - name: kaos-context-model-training
        valueFrom:
          path: /work/context/model-training.json
      - name: kaos-context-qat-finetune
        valueFrom:
          path: /work/context/qat-finetune.json
      - name: kaos-context-model-quantization
        valueFrom:
          path: /work/context/model-quantization.json
      - name: kaos-context-model-registration
        valueFrom:
          path: /work/context/model-registration.json
      - name: kaos-reused-config-validation
        valueFrom:
          path: /work/reused/config-validation.json
      - name: kaos-reused-prepare-data
        valueFrom:
          path: /work/reused/prepare-data.json
      - name: kaos-reused-model-training
        valueFrom:
          path: /work/reused/model-training.json
      - name: kaos-reused-qat-finetune
        valueFrom:
          path: /work/reused/qat-finetune.json
      - name: kaos-reused-model-quantization
        valueFrom:
          path: /work/reused/model-quantization.json
      - name: kaos-reused-model-registration
        valueFrom:
          path: /work/reused/model-registration.json
  - container:
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      image: platform-managed
    inputs:
      parameters:
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/step: config-validation
        platform.kubecore.io/step-kind: control
    name: config-validation
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
  - container:
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      image: platform-managed
    inputs:
      parameters:
      - name: kaos-context
    metadata:
      labels:
        platform.kubecore.io/produces-dataset: 'true'
        platform.kubecore.io/step: prepare-data
        platform.kubecore.io/step-kind: transform
    name: prepare-data
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
  - container:
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      image: platform-managed
      resources:
        limits:
          nvidia.com/gpu: '1'
        requests:
          nvidia.com/gpu: '1'
    inputs:
      parameters:
      - name: kaos-context
    metadata:
      annotations:
        platform.kubecore.io/hpc: 12h
      labels:
        platform.kubecore.io/step: model-training
        platform.kubecore.io/step-kind: train
    name: model-training
    outputs:
      parameters:
      - name: kaos-result
        valueFrom:
          path: /work/output/kaos-result.json
  - container:
      command:
      - python
      - -m
      - app.entry
      env:
      - name: KAOS_STEP_CONTEXT
        value: '{{inputs.parameters.kaos-context}}'
      image: platform-managed
      resources:
        limits:
          nvidia.com/gpu: '1'
        requests:
