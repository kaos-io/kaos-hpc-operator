# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      # Required: where your build of the controller image lives.
      repository: ""
      # Defaults to the chart's appVersion.
      tag: ""
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  # Where the controller runs: platforms with tainted system nodes set these.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  serviceAccountName: kaos-hpc-operator-controller-manager

# [RUNNER]: runner Jobs of serve-mode jobs (spec.stepName), created by the controller in the
# HPCSite's namespace. They run the controller's own image (entrypoint /runner/main.py).
# Image of the runner Jobs. Empty: the controller image above (one image, one version).
runnerImage: ""
runner:
  # Where runner pods go: {nodeSelector, tolerations, affinity}. Empty: like the controller
  # (controllerManager.nodeSelector, tolerations, affinity).
  scheduling: {}

# [LANES]: site lanes (QoS, reservation) the controller tries in order for each serve-mode attempt,
# after its time limit is known (PRD-HPC-1461 F-42, F-44). A candidate is used only if the HPCSite
# profile lists the QoS (and the class allows it), the limit fits the QoS's maximum wall time, its
# reservation for the class's partition is listed and not over, and the project's site user holds
# fewer jobs in that QoS than the QoS allows. No candidate fits: the class's own QoS.
# Empty (default): lane placement is off. Example, production pools leave it empty:
#   candidates:
#     - qos: test
#     - qos: dev
#       reservationByPartition: {gpu: gpudev, cpu: cpudev}
lanes:
  candidates: []

# [IDLE WATCHDOG]: ends an in-cluster (Kubernetes) GPU step as Idle when its GPU utilisation stays
# below 5 % AND its log does not grow for the window (PRD-HPC-1461 D-72, D-76); per step
# platform.kubecore.io/idle-timeout (minutes, 0 = off). Needs a per-pod GPU metric in the pool's
# metrics store: metricsUrl is its PromQL API (vmselect). Off while metricsUrl is empty.
# Enabling it adds a ClusterRole that lets the controller patch the status of and delete pods that
# carry the Argo workflow label and a GPU limit (nothing else is judged), and read their logs.
idleWatchdog:
  metricsUrl: ""
  # GKE accelerator duty cycle (stackdriver exporter). DCGM pools: DCGM_FI_DEV_GPU_UTIL with
  # namespaceLabel "namespace" and podLabel "pod".
  metric: stackdriver_k_8_s_container_kubernetes_io_container_accelerator_duty_cycle
  namespaceLabel: namespace_name
  podLabel: pod_name
  window: 20m
  scrapeInterval: 1m

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [SCRAPE]: a VMServiceScrape (operator.victoriametrics.com/v1beta1) when that API exists in the
# cluster, else a ServiceMonitor (monitoring.coreos.com/v1) when that exists, else nothing. The
# endpoint is HTTPS with authn/authz: bind the scraper's service account to the chart's
# kaos-hpc-operator-metrics-reader ClusterRole.
prometheus:
  enable: true

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false
