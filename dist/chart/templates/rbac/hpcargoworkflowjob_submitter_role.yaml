{{- if .Values.rbac.enable }}
# The pipeline-side follower step (serve mode, PRD-HPC-1461 D-59): it creates the step's
# HPCArgoWorkflowJob, watches it and, on cancel, may delete it. It has NO status verbs: only the
# controller and the runner write status. Bind it (RoleBinding) to the step's service account in
# each namespace whose workflows may use HPC; nothing else needs it.
# A pool still in phase-0 mode (the in-pod runner patches status.run) also binds
# hpcargoworkflowjob-reporter-role to the same service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: hpcargoworkflowjob-submitter-role
rules:
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcargoworkflowjobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
{{- end -}}
