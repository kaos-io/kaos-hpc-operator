{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: kaos-hpc-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcargoworkflowjobs
  - hpcsites
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hpc.kaos.io
  resources:
  - hpcargoworkflowjobs/status
  - hpcsites/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
