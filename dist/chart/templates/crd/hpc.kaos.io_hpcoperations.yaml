{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.18.0
  name: hpcoperations.hpc.kaos.io
spec:
  group: hpc.kaos.io
  names:
    kind: HPCOperation
    listKind: HPCOperationList
    plural: hpcoperations
    singular: hpcoperation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HPCOperation is an operation on a site: staging, cache check, cleanup or quota reading (PRD-HPC-1461 D-17,
          D-31). The CRD is installed, but no controller in this repository creates or reconciles it yet: the runner
          stages and cleans up inside its own job, and the quota is read by the project's snapshot job.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HPCOperationSpec is one operation on a site. By design it is named by a hash of its content, so every
              trigger of the same work converges on one object (D-31).
            properties:
              kind:
                description: OperationKind is an operation on a site (D-17, D-31).
                enum:
                - Stage
                - CacheCheck
                - Cleanup
                - QuotaRead
                type: string
              params:
                additionalProperties:
                  type: string
                description: Params of the operation, for example the dataset repo
                  and commit to stage.
                type: object
              siteName:
                description: SiteName is the HPCSite (same namespace) the operation
                  runs for.
                type: string
            required:
            - kind
            - siteName
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: 'HPCOperationStatus mirrors an HPCArgoWorkflowJob''s: phase,
              reason and the site''s report.'
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: Phase of an HPCArgoWorkflowJob.
                enum:
                - Pending
                - Waiting
                - Refused
                - Admitted
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              reason:
                type: string
              run:
                description: |-
                  RunStatus is written by the submitter (in phase 0 the in-pod runner, D-34): what the site says
                  about the current attempt's site job. The controller only reads it.
                properties:
                  attempt:
                    description: |-
                      Attempt this report is about (status.attempt when it was written). A report of an earlier
                      attempt is ignored.
                    format: int32
                    minimum: 1
                    type: integer
                  checkpoint:
                    description: |-
                      Checkpoint is what the job reported about the checkpoint copies it keeps (D-74, D-75): the newest
                      copy's progress and size, and the step's and project's total. Reported with every attempt end.
                    properties:
                      bytes:
                        description: Bytes is the size of the newest copy.
                        format: int64
                        minimum: 0
                        type: integer
                      digest:
                        description: |-
                          Digest identifies the folder's content (sha256 over its files' checksums). A copy with another digest
                          than the one before it counts as progress when the step reports no progress values.
                        maxLength: 64
                        type: string
                      progressText:
                        description: ProgressText is the progress in words, for example
                          "epoch=3 step=1200".
                        maxLength: 200
                        type: string
                      progressValues:
                        description: |-
                          ProgressValues are the numbers the copy's progress is compared by (epoch, step, ...; most
                          significant first), when the step saved through the KAOS library. Empty: compare Digest.
                        items:
                          format: int64
                          type: integer
                        type: array
                      projectBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      skippedReason:
                        description: SkippedReason is why the latest periodic copy
                          was skipped (space guard), when it was.
                        maxLength: 300
                        type: string
                      stepBytes:
                        description: |-
                          StepBytes is all the copies the step holds (at most two) and ProjectBytes all checkpoint copies of the
                          project, as read when the report was written.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  checkpointRef:
                    description: |-
                      CheckpointRef names the newest verified checkpoint copy the job left on the site's scratch, as
                      scratch://<tar path>#<sha256> (T-19). It is reported with every recoverable end (exit 85, wall time, node
                      failure, pre-emption, idle kill). Without it a step is not continued from a checkpoint.
                    type: string
                  endTime:
                    format: date-time
                    type: string
                  exitCode:
                    description: |-
                      ExitCode of the job's step; 85 means it saved and continues (D-44). Codes the job script and the runner
                      reserve: 210 (no Apptainer), 231 (image pull), 232 (staging), 233 (batch script), 234 (no verified
                      checkpoint to restore), 235 (checkpoint copy or job comment failed), 236 (Idle), 237 (InsufficientQuota),
                      238 (SubmitLimit).
                    format: int32
                    type: integer
                  gpuUtilization:
                    description: |-
                      GPUUtilization is the step's GPU use as the on-node sampler last read it, per GPU (last value and
                      highest value of this site job). The runner reports it with the log offset every 30 s while the
                      job runs; the controller exports it as kaos_hpc_job_gpu_utilization_percent (PRD-1461 AC-69).
                    items:
                      description: GPUUtilization is one GPU's utilisation in percent,
                        as sampled on the compute node (nvidia-smi).
                      properties:
                        gpu:
                          description: GPU is the GPU's position in the node's nvidia-smi
                            list ("0", "1", ...).
                          maxLength: 8
                          type: string
                        maxPercent:
                          description: MaxPercent is the highest reading of this site
                            job.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        percent:
                          description: Percent is the latest reading.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - gpu
                      - maxPercent
                      - percent
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - gpu
                    x-kubernetes-list-type: map
                  hostJobEndTime:
                    description: |-
                      HostJobEndTime is the end of a host's Slurm job when it ended after the step (D-26): the attempt is
                      settled to it. EndTime stays the step's own end, so a learned limit comes from the step's run time,
                      never from the time the node was kept for guests (D-67).
                    format: date-time
                    type: string
                  hostJobOpen:
                    description: |-
                      HostJobOpen is set on a host's terminal report when its step ended but its Slurm job still holds the
                      node for guests (node sharing, D-26): the site charges the node until that job ends. The runner
                      reports the job's own end with HostJobOpen unset; until then the host's booking stays held.
                    type: boolean
                  hostSiteJobID:
                    description: |-
                      HostSiteJobID is set when a host job of the same project took this job onto its node
                      (node sharing, PRD-1609 D-26). The host's booking then covers the node.
                    type: string
                  lastLog:
                    description: |-
                      LastLog is the tail of the step's log (a few lines, at most 2 KiB), reported only when the
                      idle watchdog ended the step, so the controller can name what the step last said (D-72).
                    maxLength: 2048
                    type: string
                  logOffset:
                    description: |-
                      LogOffset is how far into the site job's output file the runner has printed (bytes), so a
                      restarted runner prints each line once (PRD-1461 D-65, AC-70).
                    format: int64
                    minimum: 0
                    type: integer
                  message:
                    description: |-
                      Message is a plain sentence from the submitter about why the attempt ended, set when the controller
                      cannot know it from the site (InsufficientQuota: what did not fit; SubmitLimit: the site's cap and the
                      count it read). At most 512 characters.
                    maxLength: 512
                    type: string
                  qos:
                    description: |-
                      QOS and Reservation are what the site job was actually submitted with. The submitter reports
                      them because it may fall back from a lane the site refused (PRD-HPC-1461 D-68).
                    type: string
                  queueReplaced:
                    description: |-
                      QueueReplaced lists the newest replacements of a queued site job of this attempt (at most
                      QueueReplacedKept, oldest first); QueueReplacedCount counts all of them. A queued job is replaced
                      before its credentials expire, which loses its place in the site's queue (AC-35).
                    items:
                      description: |-
                        QueueReplacement is one queued site job the runner replaced by a fresh one (PRD-HPC-1461 AC-35): the
                        replacement loses the job's place in the site's queue, so it is recorded.
                      properties:
                        at:
                          description: At is when the runner replaced the job.
                          format: date-time
                          type: string
                        newSiteJobID:
                          maxLength: 32
                          type: string
                        oldSiteJobID:
                          description: OldSiteJobID is the cancelled job; NewSiteJobID
                            its replacement.
                          maxLength: 32
                          type: string
                        queuedSeconds:
                          description: QueuedSeconds is how long the old job had been
                            queued.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            Reason: TokenRefresh (the job's wallet or token would expire before it started: the replacement
                            carries fresh credentials), HostLost (the host a guest waited for is gone), Replanned (the
                            controller planned a waiting guest as a host).
                          enum:
                          - TokenRefresh
                          - HostLost
                          - Replanned
                          type: string
                      required:
                      - at
                      - newSiteJobID
                      - oldSiteJobID
                      - queuedSeconds
                      - reason
                      type: object
                    maxItems: 5
                    type: array
                  queueReplacedCount:
                    format: int32
                    minimum: 0
                    type: integer
                  reservation:
                    type: string
                  siteJobID:
                    description: SiteJobID is the scheduler's job id.
                    type: string
                  slot:
                    description: Slot is the GPU slot the host gave this job.
                    format: int32
                    type: integer
                  startTime:
                    description: StartTime and EndTime as the site reports them.
                    format: date-time
                    type: string
                  state:
                    description: State is the scheduler's job state, for example PENDING,
                      RUNNING, COMPLETED, FAILED, TIMEOUT.
                    type: string
                  terminal:
                    description: Terminal is set by the submitter once the job will
                      not run again (it gave up retrying).
                    type: boolean
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
